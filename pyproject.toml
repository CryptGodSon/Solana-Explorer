[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "solana-explorer"
dynamic = ["version"]
description = "Explore Solana transactions and accounts from Python, the terminal or a desktop GUI."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "CryptGodSon" }]
keywords = ["solana", "blockchain", "explorer", "json-rpc", "cli", "tkinter", "spl-token"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: X11 Applications",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
solana-explorer = "solana_explorer.cli:main"

[project.gui-scripts]
solana-explorer-gui = "solana_explorer.gui:main"

[project.urls]
Homepage = "https://github.com/CryptGodSon/Solana-Explorer"
Issues = "https://github.com/CryptGodSon/Solana-Explorer/issues"

[tool.setuptools.dynamic]
version = { attr = "solana_explorer._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
solana_explorer = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
